# Red Steel 2. Heat haze (fire, smoke): the game copies the haze's screen rectangle out of the
# EFB, which clears it to a neutral distortion color, draws the distortion map there, copies it,
# and draws the scene back over the rectangle through it (an ortho -1..1 quad). The rectangle is
# where the game's camera sees the haze, not where each eye does: the quad is drawn back at the
# same EFB pixels in each eye (fullscreen), and the distortion map is not drawn, so the haze is
# off in VR.
[ElementsGroupOverride_Enable]
$Heat Haze Composite
[ElementsGroupOverride]
$Heat Haze Composite
format=element_only_v6
handling=fullscreen
sig_perspective=0
sig_ortho_left=-100
sig_ortho_right=100
sig_ortho_top=-100
sig_ortho_bottom=100
sig_use_projection=1
sig_use_projection_type=1
sig_use_layer=0
sig_use_viewport=0
sig_use_scissor=0
sig_use_render_state=1
sig_layer=0
sig_alpha=007f0000
sig_ztest=0
sig_zupdate=0
sig_zfunc=7
sig_blend_color=1
sig_blend_alpha=0
sig_efb_copy=1
[TextureElementOverride_Enable]
$Heat Haze
[TextureElementOverride]
$Heat Haze
handling=skip
texture=f660fbbdc1a3006a
