# Red Steel. Glow: the game copies the scene out of the EFB, draws it back through its post
# effects (ortho 0..1 quads: a bright pass, blurs into a 320x240 corner of the EFB that it copies
# again, and the composite over the scene) and copies each step. They are drawn at the same EFB
# pixels in each eye (fullscreen); on the virtual screen, the corner copies took the wrong pixels
# and the glow became a white haze with streaks. The depth resets (ortho quads that write only
# depth, after the skybox and before the player's arm) are drawn fullscreen by DolphinXR itself.
# The world is in centimeters (the eyes are 171 units above the floor), but 75 units per meter
# looks right in a headset.
[ElementsGroupOverride_Enable]
$Post Effects
[ElementsGroupOverride]
$Post Effects
format=element_only_v6
handling=fullscreen
sig_perspective=0
sig_ortho_left=0
sig_ortho_right=100
sig_ortho_top=0
sig_ortho_bottom=100
sig_use_projection=1
sig_use_projection_type=1
sig_use_layer=0
sig_use_viewport=0
sig_use_scissor=0
sig_use_render_state=0
sig_layer=0
[Graphics.VR]
UnitsPerMeter = 75
[VRPatch]
gun = True
wide-culling = True
