# Phantasy Star Online Episode I & II (PAL), by NMSteeven (PR #13). Tested on Meta Quest 3
# (Vulkan, multiview) and on PC (Vulkan).
# - SkipBackgroundFill: opaque background fill quad drawn last every frame; reprojected in stereo
#   it becomes an opaque panel about 1 m away.
# - DetectRenderTargets: 256x256 top-down shadow map rendered at the top left of the EFB, then
#   projected on the ground; head tracking must not be applied to it.
# - PSO HUD (screen_pane): HUD, menus, minimap and Area Map are drawn in perspective in camera
#   space, each layer at its own depth (life bar 2.7, palette 1.5, panels 10, compass 1.25, map
#   lines 2000 with their own projection, recentred by the scissor offset and clipped by a small
#   scissor). Screen Pane puts them on the virtual screen: the reference depth 2.7 lands on the
#   screen, and 5% depth strength keeps a hint of depth while the layers stay lined up. The
#   game's scissor clips the maps to their windows. No scissor in the signature so the minimap
#   and Area Map windows are included.
# - PSO Lens Flare (skip): 9 camera-space sprites lined up from the sun to the screen centre, a 2D
#   lens effect that is wrong in stereo. The sun glow itself stays in the scene.
# - Objects culled when turning the head: enable the "VR No Frustum Cull" patch in the game
#   properties (Data/Sys/GameSettings/GPOP8P.ini).
[Graphics.VR]
SkipBackgroundFill = True
DetectRenderTargets = True

[ElementsGroupOverride_Enable]
$PSO HUD
[ElementsGroupOverride]
$PSO HUD
format = element_only_v6
handling = screen_pane
screen_pane_reference_depth = 2.7
screen_pane_depth_strength = 0.05
credits = NMSteeven
sig_perspective = 1
sig_use_projection = 0
sig_use_projection_type = 1
sig_use_layer = 0
sig_use_viewport = 1
sig_use_scissor = 0
sig_use_render_state = 1
sig_vp_x = 662
sig_vp_y = 582
sig_vp_w = 320
sig_vp_h = 240
sig_alpha = 003f0000
sig_ztest = 1
sig_zupdate = 0
sig_zfunc = 7
sig_blend_color = 1
sig_blend_alpha = 1

[TextureElementOverride_Enable]
$PSO Lens Flare
[TextureElementOverride]
$PSO Lens Flare
handling = skip
texture = 8a5ec7c4731f1a4f
texture = 3b2c6363f97365e0
texture = a69b410a516ce43d
texture = 3df32461831e7bd6
texture = b454d8dc637305ca
texture = 67dd24c29b471df9
texture = 2c580903be1d55fb
