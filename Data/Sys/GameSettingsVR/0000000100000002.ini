# Wii System Menu (also the vWii one, which has the same title ID): shown on the flat panel
# (Flat Screen, 2D, no stereo). A disc or channel started from the menu stays on the panel until
# emulation stops, because the OpenXR swapchains are made for the panel; boot a game from the game
# list to play it in stereo.
[Graphics.VR]
FlatScreen = True
