handling=fullscreen
comments=While an instruction card shows, the game lays a copy of the frame it froze over the scene, which it stops drawing (Wakeboarding) or still draws (Basketball): a quad 550 units in front of its camera, covering its view only. In VR it was a flat picture in the world; fullscreen shows the frozen frame in each eye. Black after loading a savestate made during the card, as without VR: the copy is not saved.
