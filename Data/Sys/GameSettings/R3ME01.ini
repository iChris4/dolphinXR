# R3ME01 - Metroid Prime Trilogy

[OnFrame]
# Each executable aborts the GPU frame (GXAbortFrame) when it waits more than 250 ms for the GPU at
# the end of a frame, or when the command FIFO stays above its high watermark for 60 fields (10 in
# Echoes). Dolphin's GPU thread stalls that long while it compiles shaders or after a savestate
# load, and the abort then corrupts the FIFO: "Unknown opcode" errors, exploding vertices, crashes.
# This raises both limits to 32767 ms and 32767 fields. The executables share these addresses, so
# each write only happens where the original instruction is found.
$Disable GPU hang watchdog
# rs5fe_p.dol (menu)
0x8039AAEC:dword:0x3AA07FFF:0x3AA000FA
0x8039A3FC:dword:0x2C007FFF:0x2C00003C
# rs5mp1_p.dol (Prime)
0x80353614:dword:0x3AA07FFF:0x3AA000FA
0x80353460:dword:0x2C007FFF:0x2C00003C
# rs5mp2_p.dol (Echoes)
0x80371D8C:dword:0x3AA07FFF:0x3AA000FA
0x80371BE0:dword:0x2C007FFF:0x2C00000A
# rs5mp3_p.dol (Corruption)
0x803E8B74:dword:0x3AA07FFF:0x3AA000FA
0x803E8484:dword:0x2C007FFF:0x2C00003C

