# GSWE64 - Star Wars Rogue Squadron II: Rogue Leader

[OnFrame]
# Add memory patches to be applied every frame here.
# VR Wide Terrain Culling: the Death Star surface is drawn only under the camera's view, which
# leaves holes when you look around in VR. This widens the terrain renderer's own copy of the view
# (about 112 degrees, apex moved back) but not the camera's, which the game uses to stream level
# data. It also bounds the walk to the map and to the 72-row span table, and checks the tile item
# list's capacity before linking a record (a full list overwrote a heap header, and the explosion
# movie at the end of the Death Star ran out of memory). About twice the draw calls. Heightfield
# levels such as Tatooine are unchanged. Code caves at 80002E00-80002F8B, the top of the Gecko code
# handler area. The conditional lines at the end replace hooks of earlier versions in savestates.
$VR Wide Terrain Culling
