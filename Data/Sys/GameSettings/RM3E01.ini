# RM3E01 - Metroid Prime 3: Corruption

[OnFrame]
# The game aborts the GPU frame (GXAbortFrame) when it waits more than 250 ms for the GPU at the end
# of a frame, or when the command FIFO stays above its high watermark for 60 fields. Dolphin's GPU
# thread stalls that long while it compiles shaders or after a savestate load, and the abort then
# corrupts the FIFO: "Unknown opcode" errors, exploding vertices, crashes. This raises both limits
# to 32767 ms and 32767 fields.
$Disable GPU hang watchdog
0x803E9FE4:dword:0x3AA07FFF:0x3AA000FA
0x803E98F4:dword:0x2C007FFF:0x2C00003C

[OnFrame_Enabled]
$Disable GPU hang watchdog
