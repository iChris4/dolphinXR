# VR: the game skips what is outside its camera's view, so terrain and objects pop in at the
# edges when you look around in VR. These codes make its five visibility tests return "visible".
# The functions are the same in NTSC-U 1.00 and 1.02, 0xA98 bytes apart: each code checks the
# function's first instruction and patches the one it finds, so the codes do nothing on other
# versions (the old Dolphin VR's GM8E01r0 and GM8E01r2 codes). They add GPU work.
